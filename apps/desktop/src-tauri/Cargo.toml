[package]
name = "tributary-desktop"
version = "0.1.0"
description = "支流桌面端"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
